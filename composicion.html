<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-/C3R2Aw2BSw6tnqKmpxRsC034+9m+veSqRPwWjhRrQg='; style-src 'sha256-UYDEPOTIipRUGRRvSo9ksrGJvdDC5tyn7i9+tUrY5ZM='; connect-src https://docs.google.com https://*.googleusercontent.com; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Composición del torneo</title>
<style>
:root{--pared:#1d5c43;--pared-tx:#f2f7f3;--bg:#eef2ee;--card:#fff;--tx:#14231b;--mut:#5b6b62;--brd:#c9d5cc;--chip:#e4ebe5;--on:#1d5c43;--on-tx:#fff;--linea:#c8382d}
@media (prefers-color-scheme:dark){:root{--bg:#101612;--card:#18211b;--tx:#e8efe9;--mut:#9db0a3;--brd:#2e3d33;--chip:#233028;--on:#4fb383;--on-tx:#08170f;--pared:#0f3a2a;--linea:#e0554a}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{background:var(--pared);color:var(--pared-tx);padding:22px 16px 18px;border-bottom:4px solid var(--linea)}
header h1{margin:0 auto;max-width:720px;font-size:1.45rem;font-weight:800}
header p{margin:6px auto 0;max-width:720px;opacity:.9;font-size:.95rem}
main{max-width:720px;margin:0 auto;padding:14px 10px 40px}
button,select,input{font:inherit;color:var(--tx)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--linea);outline-offset:2px}
.nota{color:var(--mut);font-size:.92rem;margin:8px 4px}
.pasos{display:flex;gap:6px;margin:12px 0}
.pasos button{flex:1;min-height:44px;padding:0 4px;font-weight:700;font-size:.9rem;background:var(--chip);border:2px solid transparent;border-radius:8px;cursor:pointer}
.pasos button.on{background:var(--on);color:var(--on-tx)}
.card{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:10px;margin-bottom:12px}
.card h2{margin:0 0 6px;font-size:1.05rem;font-weight:800}
details.card>summary{cursor:pointer;font-weight:800;min-height:32px}
.sub{color:var(--mut);font-weight:400;font-size:.9rem}
.fila{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--brd)}
.fila .n{flex:1;min-width:0}
.fila select,.buscar{min-height:40px;padding:0 6px;background:var(--card);border:2px solid var(--brd);border-radius:8px}
.buscar{width:100%;margin-bottom:10px;min-height:44px;padding:0 12px}
.chip{min-height:40px;min-width:40px;padding:0 10px;font-weight:700;background:var(--chip);border:2px solid transparent;border-radius:8px;cursor:pointer}
.chip.on{background:var(--on);color:var(--on-tx)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos h3{margin:4px 0;font-size:.9rem;color:var(--mut)}
.lista{display:flex;flex-direction:column;gap:6px}
.lista .chip{text-align:left;font-weight:500;min-height:44px}
.lista .chip.sel{background:var(--linea);color:#fff;font-weight:700}
.par{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--chip);border-radius:8px;padding:6px 8px;margin-top:6px}
.acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.b{min-height:44px;padding:0 14px;font-weight:700;background:transparent;border:2px solid var(--on);border-radius:8px;cursor:pointer}
.b.pri{background:var(--on);color:var(--on-tx)}
.b:disabled{opacity:.45;cursor:not-allowed}
.aviso{color:var(--linea);font-size:.9rem}
.ok{color:var(--on);font-size:.9rem}
pre{margin:0 0 12px;white-space:pre-wrap;word-break:break-word;font:.9rem/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--chip);padding:12px;border-radius:8px;min-height:60px}
.modelo{margin-top:10px}.modelo summary{color:var(--mut);cursor:pointer}
.cargando{padding:18px 4px;color:var(--mut)}
.err{background:var(--card);border:1px solid var(--linea);border-radius:10px;padding:12px;color:var(--tx)}
.err b{color:var(--linea)}
</style>
</head>
<body>
<header><h1>Composición del torneo</h1><p>Reparte a los participantes en divisiones, forma las parejas y envía el resultado por WhatsApp.</p></header>
<main>
  <nav class="pasos" id="pasos" aria-label="Pasos"></nav>
  <div id="contenido"><p class="cargando">Cargando participantes y divisiones…</p></div>
</main>
<script>
// Enlace: ?t=T05&p=ID_DEL_ARCHIVO_PARAM. De ese archivo se leen las hojas PARAM (modalidad, TELEFONO, LINKPAR) y DIVISIONES;
// LINKPAR indica el archivo de participantes (hoja PARTICIPANTES).
const MAX_URL = 4000;   // tope prudente del enlace de WhatsApp (ya codificado); por encima solo se permite copiar
const RE_ID = /^[A-Za-z0-9_-]{1,40}$/, RE_ARCHIVO = /^[A-Za-z0-9_-]{20,100}$/;
const params = new URLSearchParams(location.search);
const pideT = (params.get('t') || '').trim(), pideP = (params.get('p') || '').trim();
const torneo = RE_ID.test(pideT) ? pideT : '';
const archivoParam = RE_ARCHIVO.test(pideP) ? pideP : '';
const CLAVE = 'liga_comp_' + torneo;

const $ = id => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; };
const norm = s => String(s ?? '').replace(/^\uFEFF/, '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
const LETRAS = 'ABC';
let DIVISIONES = [], modalidad = '', telefono = '';
let jug = [], parejas = [], grupo = {}, paso = 1, sel = null, filtro = '', cargado = false, errorCarga = '', armado = false;
const abierta = {};
const porId = id => jug.find(p => p.id === id);
const divDe = cod => DIVISIONES.find(d => d.cod === cod);
const pares = () => modalidad === 'PAREJAS';
const enPareja = id => parejas.some(x => x.d === id || x.z === id);
const clavePar = x => x.d + '-' + x.z;

// ---------------- lectura de las hojas ----------------
function parseCSV(t) {
  const filas = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; r.push(c); c = ''; filas.push(r); r = []; }
    else c += ch;
  }
  if (c !== '' || r.length) { r.push(c); filas.push(r); }
  return filas;
}
async function pedirHoja(archivo, hoja) {
  const url = 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(archivo) + '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(hoja);
  let r;
  try { r = await fetch(url, { cache: 'no-store' }); } catch (e) { throw new Error(hoja + ': no se pudo acceder al archivo (¿está compartido para ver con el enlace?)'); }
  if (!r.ok) throw new Error(hoja + ': error ' + r.status);
  const texto = await r.text();
  if (/^\s*</.test(texto)) throw new Error(hoja + ': el archivo no es accesible; compártelo para ver con el enlace');
  return parseCSV(texto);
}
function leerParametro(filas, clave) {
  const f = filas.find(r => norm(r[0]) === norm(clave));
  return f ? String(f[1] || '').trim() : '';
}
function limpiarTelefono(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  return (d.length === 9 ? '34' + d : d).slice(0, 15);
}
const columna = (cab, nombres) => cab.findIndex(c => nombres.includes(c));

// DIVISIONES: division, nombre, num_grupos, activa. Solo las activas; num_grupos 1 a 3 (si no es válido, 1).
function leerDivisiones(filas) {
  const cab = (filas[0] || []).map(norm);
  const iCod = columna(cab, ['division', 'cod', 'codigo']), iNom = columna(cab, ['nombre']), iGr = columna(cab, ['num_grupos', 'grupos', 'numgrupos']), iAct = columna(cab, ['activa', 'activo']);
  if (iCod < 0) throw new Error('la hoja DIVISIONES necesita la columna division');
  const res = [];
  filas.slice(1).forEach(f => {
    const cod = String(f[iCod] || '').trim().toUpperCase();
    if (!RE_ID.test(cod) || res.some(d => d.cod === cod)) return;
    if (iAct >= 0 && norm(f[iAct]) !== 'si') return;
    const g = parseInt(f[iGr], 10);
    res.push({ cod, nombre: String((iNom >= 0 && f[iNom]) || cod).trim().slice(0, 40), grupos: g >= 1 && g <= 3 ? g : 1 });
  });
  return res;
}
// PARTICIPANTES: solo se usan id y nombre (los teléfonos no se guardan)
function leerParticipantes(filas) {
  const cab = (filas[0] || []).map(norm);
  const iId = columna(cab, ['id', 'id_participante', 'idparticipante']), iNom = columna(cab, ['nombre_completo', 'nombre', 'jugador']);
  if (iId < 0 || iNom < 0) throw new Error('la hoja PARTICIPANTES necesita las columnas id y nombre_completo');
  const vistos = new Set(), res = [];
  filas.slice(1).forEach(f => {
    const id = String(f[iId] || '').trim(), n = String(f[iNom] || '').trim().slice(0, 80);
    if (RE_ID.test(id) && n && !vistos.has(id)) { vistos.add(id); res.push({ id, n, pos: 'D', div: DIVISIONES[0].cod }); }
  });
  if (!res.length) throw new Error('la hoja PARTICIPANTES no tiene participantes válidos');
  return res;
}
async function cargar() {
  try {
    if (!torneo || !archivoParam) throw new Error('El enlace no es válido: falta el torneo o el archivo de datos.');
    const [pa, di] = await Promise.all([pedirHoja(archivoParam, 'PARAM'), pedirHoja(archivoParam, 'DIVISIONES')]);
    modalidad = leerParametro(pa, 'modalidad').toUpperCase();
    if (!['PAREJAS', 'INDIVIDUAL'].includes(modalidad)) throw new Error('el parámetro modalidad de PARAM debe ser PAREJAS o INDIVIDUAL');
    telefono = limpiarTelefono(leerParametro(pa, 'TELEFONO'));
    DIVISIONES = leerDivisiones(di);
    if (!DIVISIONES.length) throw new Error('no hay divisiones activas en la hoja DIVISIONES');
    let idPart = leerParametro(pa, 'LINKPAR'); const u = /\/d\/([\w-]+)/.exec(idPart); if (u) idPart = u[1];
    if (!RE_ARCHIVO.test(idPart)) throw new Error('el parámetro LINKPAR de PARAM está vacío o no es válido');
    jug = leerParticipantes(await pedirHoja(idPart, 'PARTICIPANTES'));
    restaurar();
  } catch (e) { errorCarga = (e && e.message) ? e.message : 'error desconocido'; }
  cargado = true; render();
}

// ---------------- trabajo en curso (solo en este navegador, solo IDs) ----------------
function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify({ j: Object.fromEntries(jug.map(p => [p.id, [p.pos, p.div]])), p: parejas.map(x => [x.d, x.z]), g: grupo })); } catch (e) {} }
function restaurar() {
  try {
    const s = JSON.parse(localStorage.getItem(CLAVE) || 'null'); if (!s) return;
    jug.forEach(p => { const v = s.j && s.j[p.id]; if (Array.isArray(v) && (v[0] === 'D' || v[0] === 'Z') && divDe(v[1])) { p.pos = v[0]; p.div = v[1]; } });
    (s.p || []).forEach(([d, z]) => { const a = porId(d), b = porId(z); if (a && b && a.div === b.div && a.pos === 'D' && b.pos === 'Z' && !enPareja(d) && !enPareja(z)) parejas.push({ d, z }); });
    Object.entries(s.g || {}).forEach(([k, v]) => { if (LETRAS.includes(v) && (porId(k) || parejas.some(x => clavePar(x) === k))) grupo[k] = v; });
  } catch (e) {}
}
function reiniciar() { jug.forEach(p => { p.pos = 'D'; p.div = DIVISIONES[0].cod; }); parejas = []; grupo = {}; sel = null; try { localStorage.removeItem(CLAVE); } catch (e) {} }
function quitarPareja(id) { parejas = parejas.filter(x => { const q = x.d === id || x.z === id; if (q) delete grupo[clavePar(x)]; return !q; }); }

// ---------------- equipos, grupos y mensaje ----------------
function equipos(cod) {
  if (pares()) return parejas.filter(x => porId(x.d).div === cod).map(x => ({ k: clavePar(x), ids: [x.d, x.z] }));
  return jug.filter(p => p.div === cod).map(p => ({ k: p.id, ids: [p.id] }));
}
const nombreEq = e => e.ids.map(id => porId(id).n).join(' / ');
const grupoDe = (cod, e) => { const d = divDe(cod); if (d.grupos === 1) return 'A'; const g = grupo[e.k]; return g && LETRAS.indexOf(g) < d.grupos ? g : ''; };
const divsConGrupos = () => DIVISIONES.filter(d => d.grupos > 1);
const pasosActivos = () => [[1, 'Divisiones'], ...(pares() ? [[2, 'Parejas']] : []), ...(divsConGrupos().length ? [[3, 'Grupos']] : []), [4, 'Mensaje']];
function lineasMensaje() {
  const L = [];
  DIVISIONES.forEach(d => { for (let g = 0; g < d.grupos; g++) equipos(d.cod).filter(e => grupoDe(d.cod, e) === LETRAS[g]).forEach(e => L.push([d.cod, LETRAS[g], ...e.ids].join(' '))); });
  return L;
}
const textoMensaje = () => ['!!I#-' + torneo, ...lineasMensaje()].join('\n');
const urlWhatsApp = () => 'https://wa.me/' + telefono + '?text=' + encodeURIComponent(textoMensaje());

// ---------------- pantallas ----------------
function pintarLista(cont) {
  cont.innerHTML = '';
  const f = norm(filtro);
  DIVISIONES.forEach(d => {
    const ps = jug.filter(p => p.div === d.cod);
    const det = el('details', 'card'); det.open = abierta[d.cod] !== false;
    det.addEventListener('toggle', () => { abierta[d.cod] = det.open; });
    const s = el('summary', '', d.nombre + ' ');
    s.appendChild(el('span', 'sub', ps.length + ' jugadores' + (pares() ? ` · ${ps.filter(p => p.pos === 'D').length} D · ${ps.filter(p => p.pos === 'Z').length} Z` : '')));
    det.appendChild(s);
    ps.filter(p => !f || norm(p.n).includes(f)).forEach(p => {
      const fila = el('div', 'fila'); fila.appendChild(el('span', 'n', p.n));
      if (pares()) { const b = el('button', 'chip', p.pos); b.title = 'Cambiar entre delantero (D) y zaguero (Z)'; b.onclick = () => { p.pos = p.pos === 'D' ? 'Z' : 'D'; quitarPareja(p.id); render(); }; fila.appendChild(b); }
      const s2 = el('select'); s2.setAttribute('aria-label', 'División de ' + p.n);
      DIVISIONES.forEach(x => { const o = el('option', '', x.nombre); o.value = x.cod; if (x.cod === p.div) o.selected = true; s2.appendChild(o); });
      s2.onchange = () => { p.div = s2.value; quitarPareja(p.id); delete grupo[p.id]; render(); };
      fila.appendChild(s2); det.appendChild(fila);
    });
    cont.appendChild(det);
  });
}
function paso1(c) {
  c.appendChild(el('p', 'nota', pares() ? 'Coloca a cada jugador en su división y márcalo como delantero (D) o zaguero (Z).' : 'Coloca a cada jugador en su división.'));
  const b = el('input', 'buscar'); b.type = 'search'; b.placeholder = 'Buscar jugador'; b.value = filtro; b.setAttribute('aria-label', 'Buscar jugador');
  const lista = el('div'); b.oninput = () => { filtro = b.value; pintarLista(lista); };
  c.append(b, lista); pintarLista(lista);
  const r = el('button', 'b', armado ? 'Pulsa otra vez para confirmar' : 'Empezar de nuevo');
  r.onclick = () => { if (!armado) { armado = true; r.textContent = 'Pulsa otra vez para confirmar'; setTimeout(() => { armado = false; r.textContent = 'Empezar de nuevo'; }, 4000); } else { armado = false; reiniciar(); render(); } };
  c.appendChild(r);
}
function pulsar(id) {
  const p = porId(id);
  if (sel === null || sel === id) sel = sel === id ? null : id;
  else { const q = porId(sel); if (q.div === p.div && q.pos !== p.pos) { const d = q.pos === 'D' ? q : p, z = q.pos === 'Z' ? q : p; parejas.push({ d: d.id, z: z.id }); sel = null; } else sel = id; }
  render();
}
function autoPares(cod) {
  const L = jug.filter(p => p.div === cod && !enPareja(p.id)), D = L.filter(p => p.pos === 'D'), Z = L.filter(p => p.pos === 'Z');
  for (let i = 0; i < Math.min(D.length, Z.length); i++) parejas.push({ d: D[i].id, z: Z[i].id });
  render();
}
function paso2(c) {
  c.appendChild(el('p', 'nota', 'Toca un delantero y un zaguero de la misma división para formar una pareja.'));
  DIVISIONES.forEach(d => {
    const card = el('section', 'card'); const libres = jug.filter(p => p.div === d.cod && !enPareja(p.id));
    const h = el('h2', '', d.nombre + ' '); h.appendChild(el('span', 'sub', `${equipos(d.cod).length} parejas · ${libres.length} sin pareja`)); card.appendChild(h);
    const dos = el('div', 'dos');
    [['D', 'Delanteros'], ['Z', 'Zagueros']].forEach(([pos, tit]) => {
      const col = el('div'); col.appendChild(el('h3', '', tit)); const l = el('div', 'lista');
      libres.filter(p => p.pos === pos).forEach(p => { const b = el('button', 'chip' + (sel === p.id ? ' sel' : ''), p.n); b.onclick = () => pulsar(p.id); l.appendChild(b); });
      col.appendChild(l); dos.appendChild(col);
    });
    card.appendChild(dos);
    parejas.filter(x => porId(x.d).div === d.cod).forEach(x => {
      const f = el('div', 'par'); f.appendChild(el('span', '', nombreEq({ ids: [x.d, x.z] })));
      const q = el('button', 'b', 'Quitar'); q.onclick = () => { delete grupo[clavePar(x)]; parejas = parejas.filter(y => y !== x); render(); }; f.appendChild(q); card.appendChild(f);
    });
    const a = el('div', 'acc'); const ab = el('button', 'b', 'Emparejar el resto en orden'); ab.onclick = () => autoPares(d.cod); a.appendChild(ab); card.appendChild(a);
    c.appendChild(card);
  });
}
function paso3(c) {   // solo divisiones con más de un grupo: las de un solo grupo no se muestran
  c.appendChild(el('p', 'nota', 'Asigna cada ' + (pares() ? 'pareja' : 'jugador') + ' a un grupo.'));
  divsConGrupos().forEach(d => {
    const card = el('section', 'card'), eq = equipos(d.cod), h = el('h2', '', d.nombre + ' ');
    h.appendChild(el('span', 'sub', Array.from({ length: d.grupos }, (_, g) => `${LETRAS[g]}: ${eq.filter(e => grupoDe(d.cod, e) === LETRAS[g]).length}`).join(' · '))); card.appendChild(h);
    eq.forEach(e => {
      const f = el('div', 'fila'); f.appendChild(el('span', 'n', nombreEq(e)));
      for (let g = 0; g < d.grupos; g++) { const b = el('button', 'chip' + (grupoDe(d.cod, e) === LETRAS[g] ? ' on' : ''), LETRAS[g]); b.onclick = () => { grupo[e.k] = LETRAS[g]; render(); }; f.appendChild(b); }
      card.appendChild(f);
    });
    const a = el('div', 'acc'), r = el('button', 'b', 'Repartir en orden');
    r.onclick = () => { eq.forEach((e, i) => { grupo[e.k] = LETRAS[i % d.grupos]; }); render(); }; a.appendChild(r); card.appendChild(a); c.appendChild(card);
  });
}
function avisos() {
  const av = [];
  DIVISIONES.forEach(d => {
    if (pares()) { const n = jug.filter(p => p.div === d.cod && !enPareja(p.id)).length; if (n) av.push(`${d.nombre}: ${n} jugadores sin pareja (no se incluirán).`); }
    if (d.grupos > 1) { const s = equipos(d.cod).filter(e => !grupoDe(d.cod, e)).length; if (s) av.push(`${d.nombre}: ${s} sin grupo (no se incluirán).`); }
    if (!equipos(d.cod).length) av.push(`${d.nombre}: no tiene ningún equipo.`);
  });
  return av;
}
function paso4(c) {
  const card = el('section', 'card'); card.appendChild(el('h2', '', 'Resumen'));
  const av = avisos();
  if (!av.length) card.appendChild(el('p', 'ok', 'Todo está completo.'));
  av.forEach(a => card.appendChild(el('p', 'aviso', a)));
  const L = lineasMensaje(), texto = textoMensaje(), largo = urlWhatsApp().length > MAX_URL;
  card.appendChild(el('p', 'nota', `${L.length} equipos en el mensaje · ${texto.length} caracteres.`));
  if (largo) card.appendChild(el('p', 'aviso', 'El mensaje es demasiado largo para el botón de WhatsApp. Usa «Copiar texto» y pégalo en el chat.'));
  const pre = el('pre', '', texto); card.appendChild(pre);
  const a = el('div', 'acc');
  const wa = el('button', 'b pri', 'Enviar por WhatsApp'); wa.disabled = !L.length || largo;
  wa.onclick = () => window.open(urlWhatsApp(), '_blank', 'noopener');
  const cp = el('button', 'b', 'Copiar texto'); cp.disabled = !L.length; const msg = el('p', 'nota');
  cp.onclick = async () => { try { await navigator.clipboard.writeText(texto); msg.textContent = 'Texto copiado.'; } catch (e) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = 'Texto seleccionado: cópialo con el menú del móvil.'; } };
  a.append(wa, cp); card.append(a, msg);
  card.appendChild(el('p', 'nota', telefono ? 'El mensaje se enviará al número terminado en ' + telefono.slice(-3) + '.' : 'Elegirás el chat al enviar.'));
  c.appendChild(card);
}
function render() {
  const nav = $('pasos'), c = $('contenido'); nav.innerHTML = ''; c.innerHTML = '';
  if (!cargado) { c.appendChild(el('p', 'cargando', 'Cargando participantes y divisiones…')); return; }

  ({ 1: paso1, 2: paso2, 3: paso3, 4: paso4 })[paso](c);

  c.appendChild(nav2);

}
