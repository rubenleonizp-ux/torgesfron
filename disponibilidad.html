<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disponibilidad de la liga de frontón</title>
<style>
:root{
  --pared:#1d5c43; --pared-tx:#f2f7f3;
  --bg:#eef2ee; --card:#ffffff; --tx:#14231b; --mut:#5b6b62; --brd:#c9d5cc;
  --chip:#e4ebe5; --on:#1d5c43; --on-tx:#ffffff; --linea:#c8382d;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#101612; --card:#18211b; --tx:#e8efe9; --mut:#9db0a3; --brd:#2e3d33;
        --chip:#233028; --on:#4fb383; --on-tx:#08170f; --pared:#0f3a2a; --linea:#e0554a;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  font:16px/1.45 "Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{background:var(--pared);color:var(--pared-tx);padding:22px 16px 18px;border-bottom:4px solid var(--linea)}
header h1{margin:0 auto;max-width:640px;font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
header p{margin:6px auto 0;max-width:640px;opacity:.9;font-size:.95rem}
main{max-width:640px;margin:0 auto;padding:16px 10px 40px}
label.nombre{display:block;font-weight:700;margin:0 4px 6px}
label.nombre input{display:block;width:100%;margin-top:6px;padding:12px;font:inherit;color:var(--tx);
  background:var(--card);border:2px solid var(--brd);border-radius:8px}
input:focus-visible,button:focus-visible{outline:3px solid var(--linea);outline-offset:2px}
h2{margin:20px 4px 8px;font-size:1.1rem;font-weight:800}
.nota{color:var(--mut);font-size:.92rem;margin:8px 4px}
.semana{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:10px 8px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px}
.top span{color:var(--mut);font-size:.9rem}
.cols{display:grid;gap:4px}
.col{display:flex;flex-direction:column;gap:4px}
.dh{text-align:center;font-size:11px;line-height:1.15;color:var(--mut);padding-bottom:2px}
.dh b{display:block;font-size:15px;color:var(--tx)}
.dh.f,.dh.f b{color:var(--linea)}
.hs{min-height:44px;width:100%;padding:0;font:inherit;font-size:.85rem;color:var(--tx);background:var(--chip);
  border:2px solid transparent;border-radius:6px;cursor:pointer}
.hs.on{background:var(--on);color:var(--on-tx);font-weight:700}
.acciones2{display:flex;gap:8px;margin-top:10px}
.b{min-height:44px;flex:1;padding:0 8px;font:inherit;font-weight:700;color:var(--tx);background:transparent;
  border:2px solid var(--on);border-radius:8px;cursor:pointer}
.b.pri{flex:1.5;background:var(--on);color:var(--on-tx)}
[hidden]{display:none!important}
.quien{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);
  border:1px solid var(--brd);border-radius:10px;padding:10px 12px}
.quien small{display:block;color:var(--mut);font-size:.8rem}
.quien strong{font-size:1.05rem}
.quien .b{flex:0 0 auto;min-height:40px;padding:0 12px}
.res{display:flex;flex-direction:column;gap:6px;margin:8px 0 0}
.res button{min-height:44px;text-align:left;padding:0 12px;font:inherit;color:var(--tx);background:var(--card);
  border:2px solid var(--brd);border-radius:8px;cursor:pointer}
.salida{margin-top:22px;background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:14px}
.salida h2{margin:0 0 8px}
.salida pre{margin:0 0 12px;white-space:pre-wrap;word-break:break-word;font:.9rem/1.5 ui-monospace,Menlo,Consolas,monospace;
  background:var(--chip);padding:12px;border-radius:8px;min-height:60px}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
.acciones button{flex:1 1 140px;padding:13px;font:inherit;font-weight:700;border-radius:8px;cursor:pointer;
  border:2px solid var(--on);background:transparent;color:var(--tx)}
.acciones button.pri{background:var(--on);color:var(--on-tx)}
.acciones button:disabled{opacity:.45;cursor:not-allowed}
#aviso{min-height:1.4em;margin:10px 0 0;color:var(--mut);font-size:.92rem}
</style>
</head>
<body>
<header>
  <h1>Disponibilidad de la liga</h1>
  <p>Indica cuándo puedes jugar y envía el mensaje por WhatsApp.</p>
</header>
<main>
  <div id="buscar">
    <label class="nombre" for="tel">Tu teléfono
      <input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="Escribe tu número">
    </label>
    <div id="resultados" class="res"></div>
  </div>
  <div id="elegido" class="quien" hidden>
    <div><small>Jugador</small><strong id="nombreElegido"></strong></div>
    <button id="cambiar" class="b">Cambiar jugador</button>
  </div>
  <div id="contenido"></div>
  <section class="salida">
    <h2>Mensaje</h2>
    <pre id="msg"></pre>
    <div class="acciones">
      <button id="wa" class="pri">Enviar por WhatsApp</button>
      <button id="copiar">Copiar texto</button>
    </div>
    <p id="aviso" role="status"></p>
  </section>
</main>
<script>
'use strict';

const NUM_SEMANAS = 5;
const params = new URLSearchParams(location.search);
const torneo = (params.get('t') || '').trim();
const archivoParam = (params.get('p') || '').trim();

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const OFF = { L: 0, M: 1, X: 2, J: 3, V: 4, S: 5, D: 6 };
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; };
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
const mes3 = m => MESES[m].slice(0, 3).toLowerCase();

function semanaISO(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const ini = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - ini) / 86400000 + 1) / 7);
}

const hoy = new Date();
const l0 = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
l0.setDate(l0.getDate() - ((l0.getDay() + 6) % 7));
const desp = (hoy.getDay() === 0 || hoy.getDay() === 6) ? 2 : 1;
const desdeInicio = n => new Date(l0.getFullYear(), l0.getMonth(), l0.getDate() + 7 * desp + n);

const semanas = [];
for (let i = 0; i < NUM_SEMANAS; i++) {
  const f = k => desdeInicio(7 * i + k), lunes = f(0), dom = f(6);
  semanas.push({
    num: semanaISO(lunes), mes: MESES[lunes.getMonth()], clave: lunes.getFullYear() * 12 + lunes.getMonth(),
    rango: lunes.getMonth() === dom.getMonth()
      ? lunes.getDate() + ' – ' + dom.getDate() + ' ' + mes3(dom.getMonth())
      : lunes.getDate() + ' ' + mes3(lunes.getMonth()) + ' – ' + dom.getDate() + ' ' + mes3(dom.getMonth()),
    nums: Object.fromEntries(Object.entries(OFF).map(([c, k]) => [c, f(k).getDate()])),
    fechas: Object.fromEntries(Object.entries(OFF).map(([c, k]) => [c, ymd(f(k))])),
    sel: new Set()
  });
}

let agenda = { estado: archivoParam ? 'cargando' : 'error', msg: 'Este enlace no indica de qué torneo leer la agenda.' };
let telefono = '';
let jugadores = null;
let jugadorSel = null;
let errorJugadores = '';

function parseCSV(t) {
  const filas = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) {
      if (ch === '"') {
        if (t[i + 1] === '"') { c += '"'; i++; }
        else q = false;
      } else c += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && t[i + 1] === '\n') i++;
      r.push(c); c = ''; filas.push(r); r = [];
    } else c += ch;
  }
  if (c !== '' || r.length) { r.push(c); filas.push(r); }
  return filas;
}

const norm = s => String(s).replace(/^\uFEFF/, '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();

function construirAgenda(filas) {
  const codigos = { lunes: 'L', martes: 'M', miercoles: 'X', jueves: 'J', viernes: 'V', sabado: 'S', domingo: 'D' };
  const ABREV = { L: 'Lun', M: 'Mar', X: 'Mié', J: 'Jue', V: 'Vie', S: 'Sáb', D: 'Dom' };
  const f = filas.filter(r => r.some(c => String(c).trim() !== ''));
  const dias = [];
  (f[0] || []).forEach((n, i) => {
    const cod = codigos[norm(n)];
    if (!cod || dias.some(d => d.cod === cod)) return;
    const horas = f.slice(1).map(r => (r[i] || '').trim()).filter(Boolean).map(x => {
      const m = /^(\d{1,2}):(\d{2})/.exec(x);
      return m ? pad(+m[1]) + ':' + m[2] : x;
    });
    dias.push({ cod, abrev: ABREV[cod], horas: [...new Set(horas)].sort() });
  });
  if (!dias.length) throw new Error('Formato de AGENDA no reconocido');
  dias.sort((a, b) => OFF[a.cod] - OFF[b.cod]);
  return { estado: 'ok', dias };
}

function leerParametro(filas, clave) {
  const objetivo = norm(clave);
  const fila = filas.find(r => norm(r[0] || '') === objetivo);
  const valor = fila ? String(fila[1] || '').trim() : '';
  console.log('[PARAM] Buscar', clave, '=> fila:', fila, '=> valor:', valor);
  return valor;
}

function limpiarTelefono(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  return d.length === 9 ? '34' + d : d;
}

const digitos = s => String(s || '').replace(/\D/g, '');
const clave9 = s => { const d = digitos(s); return d.length > 9 ? d.slice(-9) : d; };

async function cargarJugadores(idPart) {
  console.group('[PARTICIPANTES] Diagnóstico');
  try {
    console.log('LINKPAR recibido:', JSON.stringify(idPart));
    if (!idPart) throw new Error('sin LINKPAR');

    const url = 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(idPart) +
      '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent('PARTICIPANTES');
    console.log('URL solicitada:', url);

    const r = await fetch(url, { cache: 'no-store' });
    console.log('Respuesta HTTP:', r.status, r.statusText, 'URL final:', r.url);
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + r.statusText);

    const texto = await r.text();
    console.log('CSV recibido, primeros 500 caracteres:', texto.slice(0, 500));
    const filas = parseCSV(texto);
    console.log('Filas interpretadas:', filas);

    const cab = (filas[0] || []).map(norm);
    console.log('Cabeceras normalizadas:', cab);

    const col = nombres => cab.findIndex(c => nombres.includes(c));
    const iId = col(['id', 'id_participante', 'idparticipante']);
    const iTel = col(['telefono', 'tel', 'movil']);
    const iNom = col(['nombre_completo', 'nombre', 'jugador']);
    const iAli = col(['alias']);
    console.log('Índices:', { iId, iTel, iNom, iAli });

    if (iId < 0 || iTel < 0) throw new Error('formato: faltan las columnas id o telefono');

    jugadores = filas.slice(1).map(f => ({
      id: String(f[iId] || '').trim(),
      nombre: String((iNom >= 0 && f[iNom]) || (iAli >= 0 && f[iAli]) || '').trim(),
      tel: clave9(f[iTel])
    })).filter(j => j.id && j.tel);

    console.log('Jugadores válidos:', jugadores);
    if (!jugadores.length) throw new Error('vacío: no hay filas con id y teléfono válidos');

    errorJugadores = '';
    let guardado = null;
    try { guardado = localStorage.getItem('liga_jugador_' + torneo); } catch (e) {}
    jugadorSel = jugadores.find(j => j.id === guardado) || null;
    console.log('Carga correcta. Jugador guardado:', guardado, 'Jugador seleccionado:', jugadorSel);
  } catch (e) {
    console.error('ERROR al cargar PARTICIPANTES:', e);
    jugadores = [];
    const motivo = e && e.message ? e.message : String(e);
    errorJugadores = 'No se pudo cargar la lista de participantes. Motivo técnico: ' + motivo;
  } finally {
    console.groupEnd();
  }
}

async function cargarDatos() {
  console.group('[INICIO] Carga de datos');
  console.log('URL actual:', location.href);
  console.log('Parámetro t:', JSON.stringify(torneo));
  console.log('Parámetro p:', JSON.stringify(archivoParam));

  if (!archivoParam) {
    console.error('Falta el parámetro p en la URL');
    console.groupEnd();
    return;
  }

  const base = 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(archivoParam) +
    '/gviz/tq?tqx=out:csv&headers=1&sheet=';

  const pedir = async hoja => {
    const url = base + encodeURIComponent(hoja);
    console.group('[HOJA] ' + hoja);
    try {
      console.log('URL solicitada:', url);
      const r = await fetch(url, { cache: 'no-store' });
      console.log('Respuesta HTTP:', r.status, r.statusText, 'URL final:', r.url);
      if (!r.ok) throw new Error(hoja + ': HTTP ' + r.status + ' ' + r.statusText);
      const texto = await r.text();
      console.log('CSV recibido, primeros 500 caracteres:', texto.slice(0, 500));
      const filas = parseCSV(texto);
      console.log('Filas interpretadas:', filas);
      return filas;
    } catch (e) {
      console.error('Error solicitando ' + hoja + ':', e);
      throw e;
    } finally {
      console.groupEnd();
    }
  };

  const [ag, pa] = await Promise.allSettled([pedir('AGENDA'), pedir('PARAM')]);
  console.log('Resultado AGENDA:', ag);
  console.log('Resultado PARAM:', pa);

  try {
    if (ag.status !== 'fulfilled') throw ag.reason;
    agenda = construirAgenda(ag.value);
  } catch (e) {
    console.error('Error procesando AGENDA:', e);
    agenda = { estado: 'error', msg: 'No se pudo leer la agenda del torneo. Motivo técnico: ' + (e.message || String(e)) };
  }

  if (pa.status !== 'fulfilled') {
    const motivo = pa.reason && pa.reason.message ? pa.reason.message : String(pa.reason);
    console.error('PARAM no se pudo descargar:', pa.reason);
    jugadores = [];
    errorJugadores = 'No se pudo leer la hoja PARAM. Motivo técnico: ' + motivo;
    actualizar();
    console.groupEnd();
    return;
  }

  console.log('PARAM completo:', pa.value);
  telefono = limpiarTelefono(leerParametro(pa.value, 'TELEFONO'));
  const idPart = leerParametro(pa.value, 'LINKPAR');
  console.log('TELEFONO final para WhatsApp:', JSON.stringify(telefono));
  console.log('LINKPAR final:', JSON.stringify(idPart));

  if (!idPart) {
    jugadores = [];
    errorJugadores = 'La hoja PARAM se descargó, pero LINKPAR está vacío o no se encontró. Mira en consola el bloque [PARAM].';
    actualizar();
    console.groupEnd();
    return;
  }

  await cargarJugadores(idPart);
  actualizar();
  console.groupEnd();
}

function mensaje() {
  const lineas = [];
  if (agenda.estado === 'ok') semanas.forEach(w => agenda.dias.forEach(d => {
    const hs = d.horas.filter(x => w.sel.has(d.cod + '|' + x));
    if (hs.length) lineas.push(w.fechas[d.cod] + ' ' + hs.map(x => x.replace(':', '')).join(' '));
  }));
  return { jugador: jugadorSel, lineas, texto: ['!!D#-' + torneo, 'Jugador: ' + (jugadorSel ? jugadorSel.id : '?'), ...lineas].join('\n') };
}

function render(cont) {
  if (agenda.estado !== 'ok') {
    cont.appendChild(el('p', 'nota', agenda.estado === 'cargando' ? 'Cargando la agenda…' : agenda.msg));
    return;
  }
  cont.appendChild(el('p', 'nota', 'Marca las horas en que sí puedes jugar.'));
  let claveAct = null;
  semanas.forEach(w => {
    if (w.clave !== claveAct) { claveAct = w.clave; cont.appendChild(el('h2', '', w.mes)); }
    const card = el('div', 'semana');
    const top = el('div', 'top');
    top.appendChild(el('strong', '', 'Semana ' + w.num));
    top.appendChild(el('span', '', w.rango));
    card.appendChild(top);
    const g = el('div', 'cols');
    g.style.gridTemplateColumns = 'repeat(' + agenda.dias.length + ', 1fr)';
    agenda.dias.forEach(d => {
      const col = el('div', 'col');
      const cab = el('div', 'dh' + (d.cod === 'S' || d.cod === 'D' ? ' f' : ''), d.abrev);
      cab.appendChild(el('b', '', String(w.nums[d.cod])));
      col.appendChild(cab);
      d.horas.forEach(x => {
        const k = d.cod + '|' + x, on = w.sel.has(k);
        const b = el('button', 'hs' + (on ? ' on' : ''), x);
        b.setAttribute('aria-pressed', on);
        b.setAttribute('aria-label', d.abrev + ' ' + w.nums[d.cod] + ', ' + x);
        b.onclick = () => { on ? w.sel.delete(k) : w.sel.add(k); actualizar(); };
        col.appendChild(b);
      });
      g.appendChild(col);
    });
    card.appendChild(g);
    const acc = el('div', 'acciones2');
    const l = el('button', 'b', 'Limpiar semana');
    l.onclick = () => { w.sel.clear(); actualizar(); };
    const c = el('button', 'b pri', 'Copiar a todas las semanas');
    c.onclick = () => { semanas.forEach(o => { if (o !== w) o.sel = new Set(w.sel); }); actualizar(); };
    acc.append(l, c);
    card.appendChild(acc);
    cont.appendChild(card);
  });
}

function seleccionar(j) {
  jugadorSel = j;
  try { localStorage.setItem('liga_jugador_' + torneo, j.id); } catch (e) {}
}

function buscar() {
  const cont = $('resultados');
  cont.innerHTML = '';
  if (jugadorSel) return;
  const nota = t => cont.appendChild(el('p', 'nota', t));
  if (jugadores === null) return nota('Cargando participantes…');
  if (errorJugadores) return nota(errorJugadores);
  let t = digitos($('tel').value).replace(/^0034|^34/, '');
  if (t.length > 9) t = t.slice(-9);
  if (t.length < 6) return nota('Escribe tu número de teléfono (mínimo 6 cifras) y elige tu nombre.');
  const r = jugadores.filter(j => j.tel.startsWith(t));
  if (t.length === 9 && r.length === 1) { seleccionar(r[0]); return; }
  if (!r.length) return nota(t.length >= 9 ? 'Ese teléfono no está entre los participantes del torneo.' : 'Sin coincidencias de momento.');
  r.forEach(j => {
    const b = el('button', '', j.nombre || j.id);
    b.onclick = () => { seleccionar(j); actualizar(); };
    cont.appendChild(b);
  });
}

function mostrarJugador() {
  $('buscar').hidden = !!jugadorSel;
  $('elegido').hidden = !jugadorSel;
  if (jugadorSel) $('nombreElegido').textContent = jugadorSel.nombre || jugadorSel.id;
}

function actualizar() {
  buscar();
  mostrarJugador();
  const cont = $('contenido');
  cont.innerHTML = '';
  render(cont);
  const m = mensaje(), listo = m.jugador && m.lineas.length;
  $('msg').textContent = m.texto;
  $('wa').disabled = !listo;
  $('copiar').disabled = !listo;
  $('aviso').textContent = !m.jugador ? 'Busca tu teléfono y elige tu nombre para poder enviar.'
    : !m.lineas.length ? 'Marca las horas en que puedes jugar.' : '';
}

$('tel').addEventListener('input', actualizar);
$('cambiar').onclick = () => {
  jugadorSel = null;
  try { localStorage.removeItem('liga_jugador_' + torneo); } catch (e) {}
  $('tel').value = '';
  actualizar();
  $('tel').focus();
};
$('wa').onclick = () => {
  window.open('https://wa.me/' + telefono + '?text=' + encodeURIComponent(mensaje().texto), '_blank', 'noopener');
};
$('copiar').onclick = async () => {
  try {
    await navigator.clipboard.writeText(mensaje().texto);
    $('aviso').textContent = 'Texto copiado.';
  } catch (e) {
    const r = document.createRange(); r.selectNodeContents($('msg'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    $('aviso').textContent = 'Texto seleccionado: cópialo con el menú del móvil.';
  }
};

actualizar();
cargarDatos();
</script>
</body>
</html>
